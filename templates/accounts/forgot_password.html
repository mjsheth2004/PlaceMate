{% extends 'shared/base.html' %}

{% block title %}Forgot Password - Placement Portal{% endblock %}

{% block extra_css %}
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: var(--color-background);
    }
    
    .forgot-password-wrapper {
        width: 100%;
        max-width: 400px;
        padding: calc(var(--space-unit) * 4);
    }
    
    .forgot-password-card {
        box-shadow: var(--shadow-md);
    }
    
    .forgot-password-header {
        text-align: center;
        margin-bottom: calc(var(--space-unit) * 6);
    }
    
    .forgot-password-header h1 {
        font-size: 2rem;
        margin-bottom: calc(var(--space-unit) * 2);
    }
    
    .forgot-password-header p {
        color: var(--color-text-secondary);
        font-size: 1rem;
        margin: 0;
    }
    
    .forgot-password-form .btn-submit {
        width: 100%;
        padding: calc(var(--space-unit) * 3);
        font-size: 1rem;
        margin-top: calc(var(--space-unit) * 4);
    }
    
    .auth-links {
        margin-top: calc(var(--space-unit) * 4);
        text-align: center;
        font-family: var(--font-body);
    }
    
    .back-to-login {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.875rem;
    }
    
    .back-to-login:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="forgot-password-wrapper">
    <div class="card forgot-password-card">
        <div class="forgot-password-header">
            <h1>Reset Password</h1>
            <p>Enter your email to receive a reset link</p>
        </div>
        
        <form class="forgot-password-form" method="post" action="{% url 'accounts:forgot_password' %}">
            {% csrf_token %}
            
            <div class="input-group">
                <label for="email" class="input-label">Email Address</label>
                <input type="email" id="email" name="email" class="input-field" placeholder="Enter your registered email" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-submit">Send Reset Link</button>
        </form>
        
        <div class="auth-links">
            <a href="{% url 'accounts:login' %}" class="back-to-login">&larr; Back to Log In</a>
        </div>
    </div>
</div>
{% endblock %}
