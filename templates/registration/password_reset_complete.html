{% extends 'shared/base.html' %}

{% block title %}Password Reset Complete - PlaceMate{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="card" style="max-width: 450px; width: 100%; text-align: center; padding: 2.5rem;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
        <h2 style="color: var(--color-primary); margin-bottom: 1rem;">Password Reset Complete</h2>
        <p style="color: var(--color-text-secondary); margin-bottom: 2rem;">Your password has been set. You may now log in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%;">Log In Now</a>
    </div>
</div>
{% endblock %}
