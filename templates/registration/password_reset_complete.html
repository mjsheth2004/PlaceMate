{% extends 'shared/base.html' %}

{% block title %}Password Reset Complete - PlaceMate{% endblock %}

{% block content %}
{% include 'accounts/auth_header.html' %}
<div style="flex: 1; display: flex; justify-content: center; align-items: center; min-height: 80vh; width: 100%; margin: auto; padding: 2rem 1rem; box-sizing: border-box;">
    <div class="card" style="max-width: 520px; width: 100%; text-align: center; padding: 3.25rem 2.75rem; border-radius: 14px; box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04); border: 1px solid var(--color-border); box-sizing: border-box;">
        <div style="font-size: 3.8rem; margin-bottom: 1.25rem; line-height: 1;">✅</div>
        <h1 style="color: var(--color-text-primary); font-size: 2.2rem; font-weight: 700; margin-top: 0; margin-bottom: 1rem; letter-spacing: -0.02em;">Password Reset Complete</h1>
        <p style="color: var(--color-text-secondary); margin-bottom: 2.25rem; font-size: 1.05rem; line-height: 1.5;">Your password has been set. You may now log in with your new password.</p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%; padding: 0.95rem 1.5rem; font-size: 1.08rem; font-weight: 600; border-radius: 8px; display: inline-block; box-sizing: border-box;">Log In Now</a>
    </div>
</div>
{% endblock %}
