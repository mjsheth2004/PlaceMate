{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Management Portal{% endblock %}</title>
    
    <!-- Zero-flicker Theme Initialization (Defaults to Light Mode) -->
    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    
    <!-- Google Fonts as per 06_Design.md -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=3.4">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        {% if messages %}
            <div class="messages-container" id="global-messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            <script src="{% static 'js/notifications.js' %}"></script>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    
    <!-- Global Theme Switcher Logic -->
    <script src="{% static 'js/theme_toggle.js' %}?v=3.3"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
