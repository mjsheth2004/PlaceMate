{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Placement Management Portal{% endblock %}</title>
    
    <!-- Google Fonts as per 06_Design.md -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}?v=2.1">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        {% if messages %}
            <div class="messages-container" id="global-messages" style="padding: 1rem; max-width: 800px; margin: 0 auto; transition: opacity 0.5s ease;">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" style="padding: 1rem; margin-bottom: 1rem; border-radius: 4px; background-color: {% if message.tags == 'error' %}#f8d7da{% elif message.tags == 'success' %}#d4edda{% else %}#e2e3e5{% endif %}; color: {% if message.tags == 'error' %}#721c24{% elif message.tags == 'success' %}#155724{% else %}#383d41{% endif %}; border: 1px solid {% if message.tags == 'error' %}#f5c6cb{% elif message.tags == 'success' %}#c3e6cb{% else %}#d6d8db{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
            <script src="{% static 'js/notifications.js' %}"></script>
        {% endif %}
        {% block content %}
        {% endblock %}
    </div>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
